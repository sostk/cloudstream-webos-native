# SPDX-License-Identifier: GPL-3.0-or-later
# Temporary read-only analysis of the exact tester package for issue #15.
name: Legacy playback crash analysis
on:
  pull_request:
    paths: [.github/workflows/legacy-playback-analysis.yml]
permissions:
  contents: read
  actions: read
jobs:
  sdl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/webos-ndk
      - uses: actions/download-artifact@v4
        with:
          name: org.csweb.tv.legacy-ipk
          run-id: 39847551314
          github-token: ${{ github.token }}
          path: baseline
      - name: Inspect tester package and SDL fault instruction
        run: |
          mkdir extracted
          ipk=$(find baseline -name '*.ipk' -print -quit)
          ar p "$ipk" data.tar.gz | tar -xz -C extracted
          app=$(find extracted -name csweb-tv -print -quit)
          sdl=$(find extracted -name libSDL2-2.0.so.0 -print -quit)
          readelf -n "$app"
          readelf -lW "$sdl"
          "$WEBOS_NDK/bin/arm-webos-linux-gnueabi-objdump" -d \
            --start-address=0xde400 --stop-address=0xde4c0 "$sdl"
          "$WEBOS_NDK/bin/arm-webos-linux-gnueabi-objdump" -d \
            --start-address=0x6d680 --stop-address=0x6d700 "$sdl"
          readelf -Ws "$sdl" | grep -E 'CreateExportedWindow|SDL_GL_GetCurrentWindow'
