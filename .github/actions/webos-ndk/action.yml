# SPDX-License-Identifier: GPL-3.0-or-later
# Installs the webOS NDK the project builds with (openlgtv/buildroot-nc4 webos-d7ed7ee, arm-webos-linux-gnueabi
# gcc 12.2.0, as in docs/STATUS.md), checked by SHA-256, and sets WEBOS_NDK. GitHub publishes no digest for
# this release; the one below was taken on 2026-10-20.
name: webOS NDK
description: Download, verify and relocate the webOS NDK; export WEBOS_NDK
runs:
  using: composite
  steps:
    - name: Cache the webOS NDK
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/ndk.tar.gz
        key: webos-ndk-32816626e99fb34922a49d0c639f7c8a30356fffb222372d4823027f1382f640

    - name: Download the webOS NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL --retry 3 -o ~/ndk.tar.gz \
          https://github.com/openlgtv/buildroot-nc4/releases/download/webos-d7ed7ee/arm-webos-linux-gnueabi_sdk-buildroot.tar.gz

    - name: Verify and install the webOS NDK
      shell: bash
      run: |
        echo "32816626e99fb34922a49d0c639f7c8a30356fffb222372d4823027f1382f640  $HOME/ndk.tar.gz" | sha256sum -c -
        mkdir -p ~/webos-ndk
        tar -xzf ~/ndk.tar.gz -C ~/webos-ndk
        (cd ~/webos-ndk/arm-webos-linux-gnueabi_sdk-buildroot && ./relocate-sdk.sh)
        echo "WEBOS_NDK=$HOME/webos-ndk/arm-webos-linux-gnueabi_sdk-buildroot" >> "$GITHUB_ENV"

    # The kit builds libdovi (Rust, cmake/LibDovi.cmake) for armv7-unknown-linux-gnueabi with the NDK's
    # gcc as linker. The runner has cargo and rustup but not that target's standard library.
    - name: Add the Rust target for libdovi
      shell: bash
      run: rustup target add armv7-unknown-linux-gnueabi
